<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1917"/>
      <stop offset="100%" style="stop-color:#292524"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d6d3d1"/>
      <stop offset="100%" style="stop-color:#a8a29e"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Camera aperture / lens inspired design -->
  <g transform="translate(256, 256)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#accent)" stroke-width="8"/>
    <!-- Inner stylized M for MyVisual -->
    <path d="M-80 60 L-80 -60 L-40 20 L0 -60 L40 20 L80 -60 L80 60"
          fill="none"
          stroke="#ffffff"
          stroke-width="16"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <!-- Camera lens highlight -->
    <circle cx="-100" cy="-100" r="20" fill="#ffffff" opacity="0.15"/>
  </g>
  <!-- Decorative dots representing focus points -->
  <circle cx="256" cy="100" r="8" fill="#d6d3d1"/>
  <circle cx="412" cy="256" r="8" fill="#d6d3d1"/>
  <circle cx="256" cy="412" r="8" fill="#d6d3d1"/>
  <circle cx="100" cy="256" r="8" fill="#d6d3d1"/>
</svg>
